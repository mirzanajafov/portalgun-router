name: pgfailover

x-go: &go
  image: pgfailover
  build:
    context: ../..
    dockerfile: Dockerfile

x-control-token: &control-token e3-control-token

x-dimension: &dimension
  <<: *go
  environment:
    PORTAL_CONTROL_TOKEN: *control-token
  cpus: 0.5
  mem_limit: 64m

x-gateway: &gateway
  <<: *go
  volumes:
    - ${E3_CONFIGS:-./configs}:/etc/portalgun:ro
  depends_on: [toxiproxy]
  cpus: 1
  mem_limit: 256m

services:
  dim-a:
    <<: *dimension
    command: ["dimension", "-id", "a", "-delay-ms", "2", "-delay-dist", "lognormal", "-delay-sigma", "0.3"]
  dim-b:
    <<: *dimension
    command: ["dimension", "-id", "b", "-delay-ms", "2", "-delay-dist", "lognormal", "-delay-sigma", "0.3"]
  dim-c:
    <<: *dimension
    command: ["dimension", "-id", "c", "-delay-ms", "2", "-delay-dist", "lognormal", "-delay-sigma", "0.3"]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    depends_on: [dim-a, dim-b, dim-c]
    cpus: 1
    mem_limit: 128m

  gateway-1:
    <<: *gateway
    command: ["gateway", "-config", "/etc/portalgun/${E3_CELL:-default}.json", "-instance", "gw-1"]
  gateway-2:
    <<: *gateway
    command: ["gateway", "-config", "/etc/portalgun/${E3_CELL:-default}.json", "-instance", "gw-2"]
    profiles: ["two"]

  loadgen:
    <<: *go
    entrypoint: ["sleep", "infinity"]
    environment:
      PORTAL_CONTROL_TOKEN: *control-token
    cpus: 3
    mem_limit: 512m
