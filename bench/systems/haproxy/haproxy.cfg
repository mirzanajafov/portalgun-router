global
    nbthread 1
    maxconn 50000

defaults
    mode http
    timeout connect 5s
    timeout client 90s
    timeout server 90s
    timeout http-keep-alive 90s

frontend main
    bind :8080
    default_backend dimensions

backend dimensions
    balance roundrobin
    http-reuse always
    server a dim-a:8080
    server b dim-b:8080
    server c dim-c:8080
