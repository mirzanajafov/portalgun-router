static_resources:
  listeners:
    - name: main
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: main
                codec_type: HTTP1
                generate_request_id: false
                route_config:
                  name: main
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: dimensions, timeout: 90s }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      suppress_envoy_headers: true
  clusters:
    - name: dimensions
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 5s
      circuit_breakers:
        thresholds:
          - max_connections: 100000
            max_pending_requests: 100000
            max_requests: 100000
      load_assignment:
        cluster_name: dimensions
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: dim-a, port_value: 8080 } } }
              - endpoint: { address: { socket_address: { address: dim-b, port_value: 8080 } } }
              - endpoint: { address: { socket_address: { address: dim-c, port_value: 8080 } } }
