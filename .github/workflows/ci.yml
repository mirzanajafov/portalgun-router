name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      PORTAL_TEST_REDIS: localhost:6379
      PORTAL_TEST_POSTGRES: postgres://postgres:portal@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  e2e:
    runs-on: ubuntu-latest
    needs: [go, lint]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -count=1 -v ./e2e/
        env:
          PORTAL_E2E: "1"
          PORTAL_E2E_KEEP: "1"
      - if: failure()
        run: docker compose -f e2e/compose.yml logs --no-color --tail 200

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.21.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck deploy/*.sh deploy/backup/*.sh
      - run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
        env:
          POSTGRES_PASSWORD: check
          PORTAL_ADMIN_TOKEN: check
          EDGE_NETWORK: edge