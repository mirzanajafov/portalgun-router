  dim-d99:
    environment:
      PORTAL_REGISTRY: ${PORTAL_REGISTRY:?set PORTAL_REGISTRY}
      PORTAL_ADVERTISE: toxiproxy:18082
      PORTAL_MAX_INFLIGHT: "256"
